<title>Seabright Collective | Independent eyewear representation, Canada</title>

<style>
:root{--bg:#EDF1F0;--ink:#0F2530;--muted:#4C6169;--line:#C5D2D0;--lens:#8CC1B6;--panel:#E1E8E7;
--serif:"Instrument Serif",Georgia,"Times New Roman",serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1D25;--ink:#E6EEEC;--muted:#9DB2B3;--line:#2A3F48;--lens:#4F8F85;--panel:#14262F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1D25;--ink:#E6EEEC;--muted:#9DB2B3;--line:#2A3F48;--lens:#4F8F85;--panel:#14262F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center;padding-top:36px;padding-bottom:12px}
.mark{display:inline-block;margin-left:-0.45em;font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink);transition:opacity .2s ease}
.mark:hover{opacity:.8}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.04em}
nav a{text-decoration:none;color:var(--muted);transition:color .2s ease}
nav a:hover{color:var(--ink)}
.hero{position:relative;padding:72px 0 40px}
h1{font:400 clamp(40px,7vw,84px)/1.02 var(--serif);letter-spacing:-.01em;margin:0 0 24px;max-width:15ch}
.lede{max-width:52ch;color:var(--muted);font-size:19px;margin:0 0 32px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border:1px solid var(--ink);border-radius:2px;text-decoration:none;font-weight:500;font-size:16px;text-align:center}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn:hover{background:var(--lens);color:#0F2530;border-color:var(--lens)}
.btn:disabled{opacity:.6;cursor:wait}
.index{display:grid;grid-template-columns:repeat(3,1fr);gap:0 32px;margin:48px 0 0;padding:0;list-style:none}
.index li{border-top:1px solid var(--line)}
.index a{display:block;padding:20px 0 22px;text-decoration:none;text-align:center}
.index svg{display:block;width:100%;max-width:230px;height:auto;margin:0 auto 12px;overflow:visible}
.f path{fill:transparent;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .25s}
.index a:hover .f path:not(.br),.index a:focus-visible .f path:not(.br){fill:var(--lens)}
.index b{display:block;font-weight:500;font-size:18px}
.draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw path{animation:none;stroke-dashoffset:0}.f path{transition:none}}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font:400 clamp(30px,4.4vw,48px)/1.1 var(--serif);margin:0 0 20px;max-width:20ch}
.cols{display:grid;grid-template-columns:1fr 1.2fr;gap:40px 64px}
p{margin:0 0 16px;max-width:60ch}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;padding:0 0 22px 48px;position:relative;max-width:56ch}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:14px}
.steps b{display:block;font-weight:600}
.panel{background:var(--panel);padding:40px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin:28px 0}
h3{font:500 20px/1.3 var(--sans);margin:0 0 8px}
.trio p{font-size:16px;margin:0}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:56px}
form{display:grid;gap:20px;margin-top:24px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email],select,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:8px 0}
textarea{min-height:72px;resize:vertical}
fieldset{border:0;padding:0;margin:0}
legend{font-size:14px;color:var(--muted);margin-bottom:8px;padding:0}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px}
.checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px;margin:0}
button.btn{cursor:pointer;font:inherit;font-weight:500;justify-self:start}
.status{min-height:1.4em;margin:0;font-size:15px}
.field-err{display:block;font-size:13px;color:#b91c1c;margin-top:4px}
footer{border-top:1px solid var(--line);padding:40px 0 56px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 48px;justify-content:space-between}
@media (max-width:760px){
  .wrap{padding:0 18px}
  header .wrap{padding-top:24px;padding-bottom:8px;gap:12px 16px}
  .mark{font-size:14px;margin-left:-0.2em}
  nav{width:100%;justify-content:space-between;gap:8px 10px;font-size:12.5px;letter-spacing:.02em}
  .hero{padding:36px 0 32px}
  .lede{font-size:17px;margin-bottom:24px}
  .cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cta .btn{width:100%;padding:12px 14px;font-size:15px}
  .index{grid-template-columns:repeat(2,1fr);gap:0 16px;margin-top:36px}
  .index a{padding:16px 4px 18px}
  .index svg{max-width:136px;margin-bottom:8px}
  .index b{font-size:15px}
  .cols,.trio,.forms{grid-template-columns:1fr}
  section{padding:48px 0}
  .panel{padding:28px 20px}
  .checks{grid-template-columns:1fr}
}
@media (max-width:380px){
  nav{justify-content:flex-start;gap:8px 14px}
  .cta{grid-template-columns:1fr}
}
.heroart{position:absolute;right:24px;top:24px;width:min(40%,440px);height:auto;pointer-events:none}
.heroart .ln{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease-out forwards}
.heroart .h{stroke:var(--line);stroke-width:1;animation-duration:2.6s}
.heroart .b{animation-delay:.9s}
.heroart .c{stroke-width:4.5;animation-delay:1.6s;animation-duration:1.8s}
.heroart .d{stroke:var(--lens);stroke-width:1.2;animation-delay:2s}
.heroart .tint{opacity:0;animation:fadein 1.2s ease-out 2.8s forwards}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.heroart .ln{animation:none;stroke-dashoffset:0}.heroart .tint{animation:none;opacity:1}}
@media (max-width:980px){.heroart{display:none}}
</style>
</head>
