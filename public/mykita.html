<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYKITA in Canada | Seabright Creative</title>
<meta name="description" content="MYKITA frames, made by hand in Berlin, represented in Canada by Seabright Creative.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root{--bg:#EDF1F0;--ink:#0F2530;--muted:#4C6169;--line:#C5D2D0;--lens:#8CC1B6;--panel:#E1E8E7;
--serif:"Instrument Serif",Georgia,"Times New Roman",serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1D25;--ink:#E6EEEC;--muted:#9DB2B3;--line:#2A3F48;--lens:#4F8F85;--panel:#14262F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1D25;--ink:#E6EEEC;--muted:#9DB2B3;--line:#2A3F48;--lens:#4F8F85;--panel:#14262F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:baseline;padding-top:28px}
.mark{font:400 26px/1 var(--serif);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:15px}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.crumb{font-size:15px;color:var(--muted);margin:40px 0 0}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:24px 0 64px}
h1{margin:0 0 24px;line-height:0}
.brand-link{text-decoration:none;display:inline-block;transition:opacity .2s ease}
.brand-link:hover{opacity:.78}
.wordmark{display:block;width:min(380px,78vw);height:auto;overflow:visible}
.art-link{display:block;transition:opacity .2s ease}
.art-link:hover{opacity:.78}
.sub{font:400 clamp(22px,3vw,30px)/1.25 var(--serif);color:var(--muted);margin:0 0 24px}
.lede{max-width:46ch;font-size:19px;margin:0 0 28px}
.btn{display:inline-block;padding:13px 22px;border:1px solid var(--ink);border-radius:2px;text-decoration:none;font-weight:500;font-size:16px;background:var(--ink);color:var(--bg);cursor:pointer;font-family:inherit}
.btn:hover{background:var(--lens);color:#0F2530;border-color:var(--lens)}
.btn:disabled{opacity:.6;cursor:wait}
.art{width:100%;height:auto;overflow:visible}
.art path{fill:transparent;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s ease-out .1s forwards}
.art .tint{fill:var(--lens);stroke:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:.35;animation:none}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.art path{animation:none;stroke-dashoffset:0}}
.facts{display:grid;grid-template-columns:repeat(5,1fr);gap:0 24px;margin:0;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts dt{font-size:14px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500}
section{padding:72px 0}
h2{font:400 clamp(30px,4.2vw,46px)/1.1 var(--serif);margin:0 0 20px;max-width:18ch}
.cols{display:grid;grid-template-columns:1fr 1.2fr;gap:32px 64px}
p{margin:0 0 16px;max-width:58ch}
.note{font-size:14px;color:var(--muted)}
.panel{background:var(--panel);padding:40px}
form{display:grid;gap:20px;margin-top:20px;max-width:460px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email]{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:8px 0}
.status{min-height:1.4em;margin:0;font-size:15px}
.field-err{display:block;font-size:13px;color:#b91c1c;margin-top:4px}
footer{border-top:1px solid var(--line);padding:40px 0 56px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 48px;justify-content:space-between}
@media (max-width:760px){.hero,.cols{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr);gap:20px 24px}.panel{padding:28px 22px}section{padding:48px 0}}
.cols figure{grid-column:1/-1;margin:24px 0 0}
.cols figure img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:var(--panel)}
figcaption{font-size:13px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<header><div class="wrap">
<a class="mark" href="/">Seabright Creative</a>
<nav aria-label="Main"><a href="/home#brands">Brands</a><a href="/home#retailers">For opticians</a><a href="/home#for-brands">For brands</a><a href="#contact">Contact</a></nav>
</div></header>

<main>
<div class="wrap">
<p class="crumb"><a href="/home#brands">Brands</a> / MYKITA</p>
<div class="hero">
<div>
<h1><a class="brand-link" href="https://mykita.com" target="_blank" rel="noopener noreferrer" aria-label="MYKITA"><svg class="wordmark" viewBox="0 0 434 86"
