<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seabright Collective | Independent eyewear representation, Canada</title>
<meta name="description" content="Seabright Collective introduces independent and luxury eyewear brands to opticians across Canada.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--bg:#EDF1F0;--ink:#0F2530;--panel:#E1E8E7;--serif:"Instrument Serif",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1D25;--ink:#E6EEEC;--panel:#14262F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1D25;--ink:#E6EEEC;--panel:#14262F;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.splash{position:relative;display:block;width:min(440px,88vw);aspect-ratio:4/5;max-height:82vh;background:var(--panel);overflow:hidden;text-decoration:none}
.splash img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.splash::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.38) 0%,transparent 35%);pointer-events:none}
.enter{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:2;font:400 20px/1 var(--serif);letter-spacing:.03em;color:#FFFFFF;text-transform:lowercase;transition:opacity .25s ease}
.splash:hover img,.splash:focus-visible img{transform:scale(1.015)}
.splash:hover .enter,.splash:focus-visible .enter{opacity:.75}
.splash:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
@media (prefers-reduced-motion:reduce){.splash img{transition:none}.splash:hover img{transform:none}}
</style>
</head>
<body>
<a class="splash" href="/home" aria-label="Enter Seabright Collective">
  <img src="/images/landing.jpg" alt="Seabright Collective">
  <span class="enter seabright collective">enter</span>
</a>
</body>
</html>
